# Test configuration.
# Tests must NOT touch the on-disk database (demo1db.mv.db in the project root),
# so they run against an isolated in-memory H2 database instead.
# LOCK_TIMEOUT is raised well above the default so the concurrency test
# (OrderPaymentFlowTest) measures correctness instead of H2's patience: several
# threads deliberately contend for the same product row and the losers must wait
# for the winner to commit, not fail with a lock-timeout.
spring.datasource.url=jdbc:h2:mem:demo1test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
