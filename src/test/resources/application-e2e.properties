# Configuration for the end-to-end HTTP test (CashierFlowEndToEndTest, activated with
# @ActiveProfiles("e2e")).
#
# Every other test runs against an in-memory H2 database through MockMvc, so nothing else in the
# suite touches a file-backed database or a real socket. That gap once shipped a configuration
# mistake that passed the whole suite and still stopped the application from starting. This
# profile closes it by mirroring the production datasource shape.
#
# The URL parameters are the part that must match production:
#   - AUTO_SERVER=TRUE is kept on purpose.
#   - DB_CLOSE_ON_EXIT=FALSE is kept OUT on purpose: H2 rejects that combination
#     ("Feature not supported: AUTO_SERVER=TRUE && DB_CLOSE_ON_EXIT=FALSE", error 50100) and the
#     application then fails to start. CashierFlowEndToEndTest asserts this directly, so
#     reintroducing it fails the build instead of failing at runtime.
#
# LOCK_TIMEOUT is raised well past the default so the concurrent-cashier test measures
# correctness rather than H2's patience: several requests deliberately contend for the same
# product row and the losers must wait for the winner to commit, not fail with a lock timeout.
#
# ddl-auto is create-drop rather than the production 'update' so every run starts from a known
# empty schema. The URL shape, not the schema lifecycle, is what this test guards. The database
# file is written under target/, so it is git-ignored and removed by 'mvn clean'.
spring.datasource.url=jdbc:h2:file:./target/e2e-db;AUTO_SERVER=TRUE;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# Expected side effect, not a test failure: because AUTO_SERVER=TRUE rules out
# DB_CLOSE_ON_EXIT=FALSE, H2 closes the database before the JVM shutdown hooks have finished, so
# tearing the context down logs "Database is already closed ... add ;DB_CLOSE_ON_EXIT=FALSE to
# the db URL" (error 90121) into target/e2e-db.trace.db. Production, which uses the same URL
# shape, behaves the same way. The in-memory test profile avoids it by setting
# DB_CLOSE_ON_EXIT=FALSE, which is only legal there because it has no AUTO_SERVER.
