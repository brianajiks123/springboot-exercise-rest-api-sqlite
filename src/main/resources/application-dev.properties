# Development profile: SQL logging.
#
# Kept out of application.properties so a normal run does not print every statement, and so the
# logging can never be mistaken for part of the application's contract. Enable it with
# --spring.profiles.active=dev (or SPRING_PROFILES_ACTIVE=dev).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
