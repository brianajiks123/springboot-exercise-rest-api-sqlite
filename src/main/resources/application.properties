spring.application.name=demo1

# Server
server.port=8080

# H2 Database (file-based)
# NOTE: H2 rejects AUTO_SERVER=TRUE together with DB_CLOSE_ON_EXIT=FALSE
# ("Feature not supported: AUTO_SERVER=TRUE && DB_CLOSE_ON_EXIT=FALSE", error 50100)
# and the application fails to start. Keep only one of the two.
# AUTO_SERVER=TRUE lets a second process (e.g. a SQL client) attach to this same
# database file while the application is running.
spring.datasource.url=jdbc:h2:file:./demo1db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# `update` keeps existing data between restarts. Do NOT use `create` here:
# it drops and recreates every table on each startup, wiping all products and orders.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Do not keep the Hibernate Session open for the whole request. Lazy associations
# must be loaded inside the service transaction, not during JSON serialization;
# leaving this on hides N+1 queries and lazy-loading mistakes.
spring.jpa.open-in-view=false

# Store/read timestamps in UTC so LocalDateTime values are stable across environments
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

